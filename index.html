<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Pong — Arcade</title>
  <link rel="stylesheet" href="style.css?v=duration-1">
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div>
        <p class="eyebrow">ARCADE CLASSIC</p>
        <h1>Pong</h1>
      </div>
      <div class="game-options">
        <label class="difficulty-control" for="mode">
          <span>Game mode</span>
          <select id="mode" aria-label="Game mode">
            <option value="computer" selected>Vs Computer</option>
            <option value="two-player">2 Players</option>
            <option value="teams">Teams</option>
          </select>
        </label>
        <label id="difficulty-control" class="difficulty-control" for="difficulty">
          <span>Difficulty</span>
          <select id="difficulty" aria-label="Computer difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
        </label>
      </div>
    </header>

    <section class="settings-row">
      <label class="match-title-control" for="match-title">
        <span>Match title</span>
        <input id="match-title" type="text" maxlength="28" placeholder="Salman Cup" autocomplete="off">
      </label>
      <label class="match-title-control" for="match-format">
        <span>Match format</span>
        <select id="match-format" aria-label="Match format">
          <option value="single" selected>Single match</option>
          <option value="best3">Best of 3</option>
          <option value="best5">Best of 5</option>
        </select>
      </label>
      <button id="save-settings-button" class="button" type="button">Save names</button>
      <button id="reset-score-button" class="button" type="button">Reset scores</button>
    </section>

    <section id="player-names" class="player-names" aria-label="Player names" hidden>
      <label for="player-one-name">Player 1 name
        <input id="player-one-name" type="text" maxlength="16" autocomplete="off" placeholder="Player 1">
      </label>
      <span class="versus">VS</span>
      <label for="player-two-name">Player 2 name
        <input id="player-two-name" type="text" maxlength="16" autocomplete="off" placeholder="Player 2">
      </label>
    </section>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card"><span id="left-player-label">You</span><strong id="player-score">0</strong></div>
      <span class="score-divider">:</span>
      <div class="score-card"><span id="right-player-label">Computer</span><strong id="computer-score">0</strong></div>
      <div class="best-score">BEST <strong id="best-score">0</strong></div>
    </section>
    <div class="game-duration" aria-label="Game duration">
      <span id="duration-mode">Vs Computer</span>
      <time id="game-duration">00:00</time>
    </div>

    <div class="court-wrap">
      <canvas id="game" width="900" height="520" tabindex="0"
        aria-label="Pong game. Player one uses W and S or the mouse. Player two uses the up and down arrow keys."></canvas>
      <div id="game-message" class="game-message" role="status" aria-live="polite">
        <span class="message-kicker">FIRST TO 5 WINS</span>
        <strong id="message-title">Ready?</strong>
        <span id="message-hint">Press Start or Space to play</span>
      </div>
    </div>

    <div class="controls">
      <button id="start-button" class="button button-primary" type="button">Start game</button>
      <button id="pause-button" class="button" type="button" disabled>Pause</button>
      <button id="restart-button" class="button" type="button">Restart</button>
      <button id="sound-button" class="button sound-button" type="button" aria-pressed="false">Sound: Off</button>
      <button id="music-button" class="button sound-button" type="button" aria-pressed="false" aria-label="Toggle background music">Music: Off</button>
    </div>
    <p id="help-text" class="help">Move with your mouse or <kbd>W</kbd>/<kbd>S</kbd> · <kbd>Space</kbd> start/pause · <kbd>R</kbd> restart</p>
  </main>
  <script src="game.js?v=duration-1"></script>
  <script src="music.js?v=music-2"></script>
</body>
</html>
